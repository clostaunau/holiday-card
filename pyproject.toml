[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license + license-files (#86)
build-backend = "hatchling.build"

[project]
name = "holiday-card"
# Single source: src/holiday_card/__init__.py (#86); a release tag must match it.
dynamic = ["version"]
description = "CLI application for creating printable holiday greeting cards"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "src/holiday_card/data/fonts/LICENSE",
    "src/holiday_card/data/fonts/curated/*-LICENSE.txt",
    "src/holiday_card/data/icc/NOTICE",
]
requires-python = ">=3.11"
authors = [
    { name = "Chris Lostaunau" }
]
keywords = ["greeting-cards", "pdf", "printing", "holidays", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Printing",
]
dependencies = [
    "reportlab>=4.0",
    "Pillow>=10.3.0",  # CVE-2024-28219 fix; core/ai_assets.py uses ImageCms
    "typer>=0.12",  # rich + shellingham are default deps since 0.12
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "pikepdf>=8.0",
    "fonttools>=4.47",  # SVG backend embeds glyph subsets (fontTools.subset, #76)
]

[project.urls]
Homepage = "https://github.com/clostaunau/holiday-card"
Source = "https://github.com/clostaunau/holiday-card"
Issues = "https://github.com/clostaunau/holiday-card/issues"
Changelog = "https://github.com/clostaunau/holiday-card/blob/main/RELEASE_NOTES.md"
Documentation = "https://clostaunau.github.io/holiday-card/"

[project.optional-dependencies]
# AI imagery (Leapfrog 3). Opt-in only — the project is fully functional
# without it. See `holiday-card ai-asset generate` and
# docs/industry-review/consensus-ai-feature.md.
ai = [
    # Capped at the major above the locked release (3.x); lift after testing a new major.
    "openai>=1.0,<4",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "pre-commit>=3.7",
    "pypdfium2>=5.0",
    "resvg-py>=0.5",
    "jsonschema>=4.18",
]

[dependency-groups]
# uv installs the `dev` group by default, so `uv sync` / `uv run pytest` get the
# dev tools without flags. It simply re-exports the `dev` extra above, which
# stays the source of truth for `pip install -e ".[dev]"`.
dev = ["holiday-card[dev]"]

[project.scripts]
holiday-card = "holiday_card.cli:app"

[tool.hatch.version]
path = "src/holiday_card/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/holiday_card"]

[tool.hatch.build.targets.sdist]
# Everything else in the repo (.claude/, .specify/, specs/, docs/, data/,
# output/ ...) stays out. tests/ ships so packagers can run the suite, and
# uv.lock ships because builds come from the locked environment (D2).
# Leading "/" anchors each gitignore-style pattern at the root.
include = [
    "/src/",
    "/tests/",
    "/LICENSE",
    "/README.md",
    "/RELEASE_NOTES.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.uv]
# numpy arrived transitively via imagehash (dropped in #68); nothing locks it
# today, but any dependency that pulls it back in must stay below 2.5. numpy 2.5 ships
# stubs using the PEP 695 `type` statement, which mypy rejects while
# `[tool.mypy] python_version = "3.11"`. Keep the lock below 2.5 until the
# supported floor moves to 3.12; the weekly latest-deps workflow ignores this
# constraint and will show when it can be lifted.
constraint-dependencies = ["numpy<2.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "visual: Visual regression tests",
    "slow: Slow-running tests",
    "pdfx: PDF/X-1a preflight (run by the pdfx-preflight CI job with poppler + Ghostscript)",
    "live_ai: calls a real, paid AI provider API; opt-in only, never run in CI (tests/live/)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["holiday_card"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "yaml.*",
    "PIL.*",
    "pikepdf.*",
    "openai.*",
    "fontTools.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/holiday_card"]
branch = true

[tool.coverage.report]
# The floor is the measured TOTAL (branch coverage) rounded down (#84).
# Raise it when coverage rises; never lower it to make a PR pass.
fail_under = 92
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "assert_never\\(",
]
