# Keeps the SHA-pinned actions and uv.lock fresh (#85, D2). Dependabot bumps a
# pin's SHA and its `# vX.Y.Z` comment together, and updates uv.lock rather
# than the pyproject.toml floors.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
