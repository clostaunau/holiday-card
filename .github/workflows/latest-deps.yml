name: Latest deps

# Weekly canary: install the newest release of every dependency, ignoring
# uv.lock and the `[tool.uv] constraint-dependencies` pins, and run the same
# quality gates as CI. Feature PRs install from the lock, so upstream breakage
# lands here first. A red run is the signal to bump the lock or lift a
# constraint — it is allowed to fail (spec D4: no continue-on-error).

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Latest deps (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fresh venv with unpinned latest deps
        run: |
          uv venv .latest-venv
          echo "VIRTUAL_ENV=$PWD/.latest-venv" >> "$GITHUB_ENV"
          echo "$PWD/.latest-venv/bin" >> "$GITHUB_PATH"
      - name: Install newest deps
        # --no-config: inside the project, `uv pip` otherwise applies
        # [tool.uv] constraint-dependencies (numpy<2.5) and the canary would
        # never see the releases it exists to catch. uv.lock is never read.
        run: uv pip install --no-config --upgrade -e ".[dev]"
      - name: Installed versions
        run: uv pip list
      - name: ruff check
        run: ruff check src/ tests/ scripts/
      - name: mypy
        run: mypy src/
      - name: pytest
        run: pytest -v

  audit:
    # New advisories land against an unchanged lock too, so the weekly run
    # re-audits uv.lock with the same pinned pip-audit as the CI `audit` job.
    name: Audit (pip-audit on uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o audit-req.txt
          uvx pip-audit==2.10.1 --disable-pip --require-hashes -r audit-req.txt --strict
