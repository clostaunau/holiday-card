name: visual-baselines

# Regenerates the per-panel visual gate's baselines (#68) on the canonical
# runner. Baselines are generated here, never on a laptop: dispatch this on
# your branch, download the `reference_cards` artifact, eyeball every PNG,
# and commit it over tests/visual/fixtures/reference_cards/.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Backend to regenerate"
        type: choice
        options: [all, png, pdf]
        default: all

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate visual baselines (ubuntu-latest / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: regenerate baselines
        env:
          BACKEND: ${{ inputs.backend }}
        run: uv run python scripts/regenerate_visual_baselines.py --backend "$BACKEND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference_cards
          path: tests/visual/fixtures/reference_cards/
          if-no-files-found: error
