name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src/ tests/ scripts/

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: mypy
        run: mypy src/

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -v --cov=holiday_card --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    name: Smoke (entry point + render)
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: console entry point exists
        run: holiday-card --version
      - name: list templates
        run: holiday-card templates
      - name: render one template per occasion
        run: |
          mkdir -p out
          holiday-card create christmas-classic    -o out/christmas.pdf
          holiday-card create birthday-balloons    -o out/birthday.pdf
          holiday-card create hanukkah-menorah     -o out/hanukkah.pdf
          holiday-card create generic-celebration  -o out/generic.pdf
          ls -la out/
          test -s out/christmas.pdf
          test -s out/birthday.pdf
          test -s out/hanukkah.pdf
          test -s out/generic.pdf
      - name: every --voice resolves and renders
        # Catches packaging regressions on the sentiment library and
        # the --voice CLI wiring. Deep voice-resolution behavior is
        # covered by tests/integration/test_voice_flag.py.
        run: |
          mkdir -p out/voices
          for voice in warm witty spare devotional irreverent; do
            holiday-card create christmas-classic --voice "$voice" --seed 42 \
              -o "out/voices/$voice.pdf"
            test -s "out/voices/$voice.pdf"
          done
          ls -la out/voices/
      - name: --export-for moo-a6 emits four panel PDFs at PDF/X-1a header
        # Catches packaging regressions on the pikepdf-based PDF/X-1a
        # post-processor and the moo-a6 export target. Deep PDF/X-1a
        # conformance is covered by tests/integration/test_pdfx_moo_a6.py;
        # the cheap header check here confirms the post-processor
        # actually ran (default PDFs are 1.7; only the moo-a6 path
        # rewrites the header down to 1.4).
        run: |
          mkdir -p out/moo
          holiday-card create christmas-classic --export-for moo-a6 -o out/moo/
          ls -la out/moo/
          for panel in front back inside-left inside-right; do
            test -s "out/moo/$panel.pdf"
          done
          head -c 8 out/moo/front.pdf | grep -q '%PDF-1.4'

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [smoke]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
