name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src/ tests/

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    # TODO: drop continue-on-error after the Wave 2 RenderCommand IR refactor
    # eliminates the panel-element type-narrowing issues. ~29 errors remain
    # (mostly missing annotations + `Panel.position: str` vs PanelPosition
    # enum drift). Job runs and reports failures so they stay visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: mypy
        run: mypy src/

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -v --cov=holiday_card --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke:
    name: Smoke (entry point + render)
    runs-on: ubuntu-latest
    # type-check intentionally not in `needs:` while it has known errors
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: console entry point exists
        run: holiday-card --version
      - name: list templates
        run: holiday-card templates
      - name: render one template per occasion
        run: |
          mkdir -p out
          holiday-card create christmas-classic   -o out/christmas.pdf
          holiday-card create valentine-hearts    -o out/valentine.pdf
          ls -la out/
          test -s out/christmas.pdf
          test -s out/valentine.pdf

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [smoke]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
