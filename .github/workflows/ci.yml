name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run ruff check src/ tests/ scripts/

  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          # Match `[tool.mypy] python_version` (the supported floor).
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: mypy
        run: uv run mypy src/

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: fribidi for Pillow's raqm text layout (macOS)
        # The PNG visual baselines are raqm renders; Pillow only uses raqm when
        # it can load libfribidi (ubuntu-latest ships it). See #68.
        if: runner.os == 'macOS'
        run: brew list fribidi >/dev/null 2>&1 || brew install fribidi
      - name: pytest
        env:
          # The visual gate (#68) writes fresh sheets, crops and diff heatmaps
          # here when a panel fails or a baseline is missing.
          HOLIDAY_CARD_VISUAL_OUT: ${{ runner.temp }}/visual-out
          # Fail, rather than skip, the PNG visual gate if raqm is unavailable.
          HOLIDAY_CARD_REQUIRE_PNG_VISUAL: "1"
        run: |
          # Exported here, not via GITHUB_ENV: SIP strips DYLD_* from /bin/bash.
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix fribidi)/lib"
          fi
          uv run pytest -v --cov=holiday_card --cov-report=xml --cov-report=term-missing
      - name: Upload visual-gate failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-out-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/visual-out/
          if-no-files-found: ignore
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  pdfx-preflight:
    # PDF/X-1a conformance gate (D11, #69). veraPDF has no PDF/X profile, so
    # the checker is renderers/pdfx_preflight.py, cross-checked here with
    # poppler `pdffonts` and a Ghostscript `inkcov` render of every moo-a6
    # file. HOLIDAY_CARD_REQUIRE_PREFLIGHT_TOOLS turns a missing tool into a
    # failure instead of a skip.
    name: PDF/X preflight (pikepdf + poppler + Ghostscript)
    runs-on: ubuntu-latest
    env:
      HOLIDAY_CARD_REQUIRE_PREFLIGHT_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: install poppler-utils and ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript
          pdffonts -v
          gs --version
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: pytest -m pdfx
        run: uv run pytest -m pdfx -v

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, pdfx-preflight]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    # Installs the *built wheel* into a clean venv and runs it from outside
    # any checkout, so missing package data (templates, themes, sentiments,
    # fonts, ICC profile) fails here instead of in a user's pipx install.
    # Deliberately no actions/checkout: nothing may resolve from the repo.
    name: Smoke (installed wheel, no checkout)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install dist/*.whl
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"
      - name: wheel ships the bundled data and licenses
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl > wheel.txt
          check() {  # check <label> <min> <regex>
            n=$(grep -cE "$3" wheel.txt || true)
            echo "$1: $n (need >= $2)"
            [ "$n" -ge "$2" ]
          }
          check templates  21 'holiday_card/data/templates/.+\.yaml'
          check sentiments 70 'holiday_card/data/sentiments/.+\.yaml'
          check ttf        25 'holiday_card/data/fonts/.+\.ttf'
          check LICENSE     1 'dist-info/licenses/LICENSE'
          check icc         1 'holiday_card/data/icc/GRACoL2013_CRPC6\.icc'
          if grep -q '_assets/' wheel.txt; then echo "stale _assets/ in wheel"; exit 1; fi
      - name: run the installed CLI outside any checkout
        working-directory: ${{ runner.temp }}
        # `cli | grep -q` under pipefail also guards #92: grep closes the pipe
        # on first match, and the CLI must exit 0 quietly on EPIPE.
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          # No override may mask missing bundled data.
          if env | grep '^HOLIDAY_CARD_'; then exit 1; fi
          holiday-card --version
          holiday-card templates | grep -q christmas
          holiday-card themes | grep -q christmas
          for t in christmas-classic birthday-balloons hanukkah-menorah generic-celebration; do
            holiday-card create "$t" -o "$t.pdf"
            test -s "$t.pdf"
          done
          # #64: template photos resolve against the bundled template dir,
          # never cwd, and SVG embeds them with the probed MIME type.
          holiday-card create christmas-photo-ornament --format svg -o photo.svg
          grep -q 'href="data:image/jpeg;base64,' photo.svg
          # Every --voice resolves against the bundled sentiment library.
          for voice in warm witty spare devotional irreverent; do
            holiday-card create christmas-classic --voice "$voice" --seed 42 -o "voice-$voice.pdf"
            test -s "voice-$voice.pdf"
          done
          # moo-a6 needs the bundled ICC profile; only the PDF/X-1a
          # post-processor rewrites the header down to 1.4.
          holiday-card create christmas-classic --export-for moo-a6 -o moo/
          for panel in front back inside-left inside-right; do
            test -s "moo/$panel.pdf"
          done
          head -c 8 moo/front.pdf | grep -q '%PDF-1.4'
