name: Build and deploy microsite

# Builds the template-gallery microsite (Leapfrog 5) and publishes
# it to GitHub Pages. The site is a static showcase: one page per
# template with a form that builds a copy-paste-ready
# `holiday-card create ...` command, hostable as plain files on
# GitHub Pages.
#
# Trigger scope: pushes to main that touch anything affecting the
# rendered output — templates, sentiments, fonts, themes, source
# code, the build script, or this workflow itself. Manual trigger
# also supported via workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      # Bundled templates/sentiments/fonts/themes live under src/holiday_card/data/.
      - "src/**"
      - "scripts/build_microsite.py"
      - ".github/workflows/microsite.yml"
  workflow_dispatch:

# GitHub Pages deployment requires these permissions. ``id-token`` is
# the OIDC handshake the deploy-pages action uses.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one site deployment at a time; cancel an in-flight build if
# a newer commit arrives.
concurrency:
  group: "microsite"
  cancel-in-progress: true

jobs:
  build:
    name: Build microsite
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install holiday-card
        run: uv sync --locked

      - name: Build static site
        run: |
          # ``_site`` is the path actions/upload-pages-artifact expects
          # by default; using it keeps the next step zero-config.
          uv run python scripts/build_microsite.py --output _site
          echo "::group::Built tree"
          find _site -maxdepth 3 -type f | sort
          echo "::endgroup::"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # The deploy-pages action needs the environment for OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
