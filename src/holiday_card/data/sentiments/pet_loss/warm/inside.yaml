voice: warm
occasion: pet_loss
role: inside
sentiments:
  - "They were lucky to have you, and you to have them. We are so sorry for your loss."
  - "A good companion. A long love. Holding you in our thoughts."
  - "The kind of love a good animal gives is rare and lasting. We are so sorry."
  - "Thinking of you — and of the years of small, ordinary joy they gave."
