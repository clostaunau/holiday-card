voice: devotional
occasion: condolence
role: inside
sentiments:
  - "May their soul find eternal rest, and may you find comfort in those they leave behind."
  - "Praying that love carries you through grief, and that grace meets you in the long quiet ahead."
  - "Their light is not lost. May it return to you in memory, in others, and in time."
  - "With prayers for peace — for them, for you, and for the family they gathered."
