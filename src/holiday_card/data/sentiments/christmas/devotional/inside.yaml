voice: devotional
occasion: christmas
role: inside
sentiments:
  - "May the peace of Christ be with you and your house this Christmas, and through every door of the year ahead."
  - "Wishing you the quiet wonder of that first Christmas — light in the darkness, hope in the cold, the promise of love made flesh."
  - "May this Christmas bring you near to the One whose coming we celebrate, and to those He has given you to love."
  - "In the spirit of the season, peace, hope, and the blessing of the Christ Child be upon your home."
