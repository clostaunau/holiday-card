# Classic Christmas Card Template
# A traditional quarter-fold card with festive red and green colors

id: "christmas-classic"
name: "Classic Christmas"
occasion: "christmas"
fold_type: "quarter_fold"
default_theme_id: "christmas-red-green"
description: "Traditional Christmas card with classic holiday colors"

panels:
  # Front panel (bottom right of the sheet; placement is computed from fold_type)
  - id: "front"
    position: "front"
    width: 4.25
    height: 5.5
    background_color:
      r: 0.8
      g: 0.1
      b: 0.1
    text_elements:
      - id: "greeting"
        content: "Merry Christmas!"
        x: 2.125  # Center of panel
        y: 2.75   # Middle of panel
        width: 3.75  # Leave 0.25" margin on each side
        font_family: "PlayfairDisplay"  # curated display serif
        font_size: 36
        alignment: "center"
        overflow_strategy: "shrink"
        min_font_size: 12
        color:
          r: 1.0
          g: 1.0
          b: 1.0

  # Back panel (bottom left of the sheet; placement is computed from fold_type)
  - id: "back"
    position: "back"
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0

  # Inside left panel (top right of the sheet, upside down; placement is computed from fold_type)
  - id: "inside_left"
    position: "inside_left"
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0

  # Inside right panel (top left of the sheet, upside down; placement is computed from fold_type)
  - id: "inside_right"
    position: "inside_right"
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0
    text_elements:
      - id: "message"
        content: "Wishing you joy and happiness this holiday season!"
        x: 0.5
        y: 3.0
        width: 3.25
        font_family: "Cormorant"  # curated editorial serif (paired with PlayfairDisplay cover)
        font_size: 14
        overflow_strategy: "wrap"
        max_lines: 6
        color:
          r: 0.2
          g: 0.2
          b: 0.2
