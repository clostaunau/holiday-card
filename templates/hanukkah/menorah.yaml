# Hanukkah Menorah Card Template
# Half-fold card with a 9-candle menorah (shamash + 8 nights) drawn
# from primitives. Deep blue background, gold menorah, warm flames.

id: "hanukkah-menorah"
name: "Hanukkah Menorah"
occasion: "hanukkah"
fold_type: "half_fold"
default_theme_id: "hanukkah-blue-white"
description: "Traditional Hanukkah card with a hand-drawn menorah"

panels:
  # Front panel (bottom right when unfolded)
  - id: "front"
    position: "front"
    x: 4.25
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 0.05
      g: 0.18
      b: 0.42  # deep night blue
    shape_elements:
      # ---- Menorah body (gold #D4AF37) ----
      # Foot — wide trapezoid suggested by a polygon (triangle approximation)
      - type: triangle
        x1: 1.625
        y1: 1.0
        x2: 2.625
        y2: 1.0
        x3: 2.125
        y3: 1.4
        fill_color: "#D4AF37"
        z_index: 2
      # Base bar (horizontal foot rectangle)
      - type: rectangle
        x: 1.125
        y: 0.95
        width: 2.0
        height: 0.12
        fill_color: "#D4AF37"
        z_index: 2
      # Central stem
      - type: rectangle
        x: 2.075
        y: 1.4
        width: 0.1
        height: 0.5
        fill_color: "#D4AF37"
        z_index: 2
      # Horizontal arm (where the 9 candles sit)
      - type: rectangle
        x: 0.55
        y: 1.85
        width: 3.15
        height: 0.07
        fill_color: "#D4AF37"
        z_index: 2

      # ---- Branches: thin lines from stem to each candle base ----
      # Left side: 4 branches angling up-left
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 0.625
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 1.0
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 1.375
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 1.75
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      # Right side: 4 mirror branches
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 2.5
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 2.875
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 3.25
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1
      - type: line
        start_x: 2.125
        start_y: 1.7
        end_x: 3.625
        end_y: 1.92
        stroke_color: "#D4AF37"
        stroke_width: 1.5
        z_index: 1

      # ---- 9 candles (white) ----
      # Shamash (center, raised)
      - type: rectangle
        x: 2.075
        y: 1.92
        width: 0.1
        height: 0.85
        fill_color: "#F8F4E8"
        z_index: 3
      # 8 night candles, evenly spaced at standard height
      - type: rectangle
        x: 0.575
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 0.95
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 1.325
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 1.7
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 2.45
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 2.825
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 3.2
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3
      - type: rectangle
        x: 3.575
        y: 1.92
        width: 0.1
        height: 0.65
        fill_color: "#F8F4E8"
        z_index: 3

      # ---- Flames (warm gold #FFB347 with a brighter highlight) ----
      # Each flame: a soft triangle apex pointing up, plus a small inner
      # bright triangle for the hot center.
      # Shamash flame (taller)
      - type: triangle
        x1: 2.085
        y1: 2.77
        x2: 2.165
        y2: 2.77
        x3: 2.125
        y3: 2.95
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 2.105
        y1: 2.78
        x2: 2.145
        y2: 2.78
        x3: 2.125
        y3: 2.88
        fill_color: "#FFE066"
        z_index: 5
      # 8 night flames (regular size). Generated by candle x-position.
      # Each pair: outer (warm) triangle + inner (bright) triangle.
      - type: triangle
        x1: 0.585
        y1: 2.57
        x2: 0.665
        y2: 2.57
        x3: 0.625
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 0.96
        y1: 2.57
        x2: 1.04
        y2: 2.57
        x3: 1.0
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 1.335
        y1: 2.57
        x2: 1.415
        y2: 2.57
        x3: 1.375
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 1.71
        y1: 2.57
        x2: 1.79
        y2: 2.57
        x3: 1.75
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 2.46
        y1: 2.57
        x2: 2.54
        y2: 2.57
        x3: 2.5
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 2.835
        y1: 2.57
        x2: 2.915
        y2: 2.57
        x3: 2.875
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 3.21
        y1: 2.57
        x2: 3.29
        y2: 2.57
        x3: 3.25
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4
      - type: triangle
        x1: 3.585
        y1: 2.57
        x2: 3.665
        y2: 2.57
        x3: 3.625
        y3: 2.71
        fill_color: "#FFB347"
        z_index: 4

      # ---- Decorative star of David hint above the menorah ----
      - type: star
        center_x: 2.125
        center_y: 4.05
        outer_radius: 0.18
        inner_radius: 0.08
        points: 6
        fill_color: "#D4AF37"
        opacity: 0.85
        z_index: 1

    text_elements:
      - id: "greeting"
        content: "Happy Hanukkah"
        x: 2.125
        y: 4.65
        width: 3.5
        font_family: "Helvetica"
        font_size: 28
        font_style: "bold"
        alignment: "center"
        color:
          r: 1.0
          g: 1.0
          b: 1.0
      - id: "subtitle"
        content: "Chag Sameach"
        x: 2.125
        y: 4.30
        width: 3.0
        font_family: "Times-Roman"
        font_size: 14
        font_style: "italic"
        alignment: "center"
        color:
          r: 0.83
          g: 0.69
          b: 0.22  # gold

  # Back panel
  - id: "back"
    position: "back"
    x: 0
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0

  # Inside left panel
  - id: "inside_left"
    position: "inside_left"
    x: 0
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180  # half-fold imposition
    background_color:
      r: 0.98
      g: 0.98
      b: 1.0

  # Inside right panel
  - id: "inside_right"
    position: "inside_right"
    x: 4.25
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180  # half-fold imposition
    background_color:
      r: 0.98
      g: 0.98
      b: 1.0
    text_elements:
      - id: "message"
        content: "May your Festival of Lights\nbe filled with joy."
        x: 0.5
        y: 3.0
        width: 3.25
        font_family: "Times-Roman"
        font_size: 16
        font_style: "italic"
        alignment: "left"
        color:
          r: 0.05
          g: 0.18
          b: 0.42
