# Miscarriage (spare). For pregnancy loss.
# Slightly softer cream, italic serif, no decoration.

id: "miscarriage-spare"
name: "After a loss (spare)"
occasion: "miscarriage"
fold_type: "half_fold"
description: "Restrained card for pregnancy loss. Soft cream, italic serif. Inside blank for a personal message."

panels:
  - id: "front"
    position: "front"
    x: 4.25
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 0.98
      g: 0.96
      b: 0.94
    text_elements:
      - id: "greeting"
        content: "Thinking of you"
        x: 2.125
        y: 2.85
        width: 3.75
        font_family: "Cormorant"
        font_size: 24
        font_style: "italic"
        alignment: "center"
        color:
          r: 0.25
          g: 0.22
          b: 0.20

  - id: "back"
    position: "back"
    x: 0
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 0.98
      g: 0.96
      b: 0.94

  - id: "inside_left"
    position: "inside_left"
    x: 0
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180
    background_color:
      r: 0.98
      g: 0.96
      b: 0.94

  - id: "inside_right"
    position: "inside_right"
    x: 4.25
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180
    background_color:
      r: 0.98
      g: 0.96
      b: 0.94
