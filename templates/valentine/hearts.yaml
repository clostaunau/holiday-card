id: valentine-hearts
name: "Valentine Hearts"
occasion: valentine
fold_type: half_fold
description: "Romantic card with cascading hearts and warm palette"
default_theme_id: valentine-classic

panels:
  - id: front
    position: front
    x: 4.25
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 0.96
      b: 0.97

    shape_elements:
      # Large central decorative heart
      - type: decorative_element
        name: heart_simple
        x: 1.0
        y: 1.5
        scale: 1.0
        color_palette:
          heart_fill: "#DC143C"
          heart_outline: "#8B0000"
        z_index: 5

      # Small accent hearts scattered
      - type: circle
        center_x: 0.6
        center_y: 4.5
        radius: 0.15
        fill_color: "#FFB6C1"
        opacity: 0.6
        z_index: 2
      - type: circle
        center_x: 0.75
        center_y: 4.6
        radius: 0.15
        fill_color: "#FFB6C1"
        opacity: 0.6
        z_index: 2
      - type: triangle
        x1: 0.45
        y1: 4.45
        x2: 0.9
        y2: 4.45
        x3: 0.675
        y3: 4.0
        fill_color: "#FFB6C1"
        opacity: 0.6
        z_index: 1

      - type: circle
        center_x: 3.5
        center_y: 4.8
        radius: 0.12
        fill_color: "#DE8F94"
        opacity: 0.5
        z_index: 2
      - type: circle
        center_x: 3.62
        center_y: 4.87
        radius: 0.12
        fill_color: "#DE8F94"
        opacity: 0.5
        z_index: 2
      - type: triangle
        x1: 3.38
        y1: 4.78
        x2: 3.74
        y2: 4.78
        x3: 3.56
        y3: 4.45
        fill_color: "#DE8F94"
        opacity: 0.5
        z_index: 1

      # Decorative stars
      - type: star
        center_x: 3.8
        center_y: 0.5
        outer_radius: 0.08
        inner_radius: 0.04
        points: 5
        fill_color: "#D4AF37"
        opacity: 0.4
        z_index: 2

    text_elements:
      - id: greeting
        content: "Happy Valentine's Day!"
        x: 2.125
        y: 0.6
        width: 3.75
        font_size: 24
        font_style: bold
        alignment: center
        overflow_strategy: shrink
        min_font_size: 14
        color:
          r: 0.5
          g: 0.0
          b: 0.13
        z_index: 100

  - id: inside_left
    position: inside_left
    x: 0.0
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180
    background_color:
      r: 1.0
      g: 0.96
      b: 0.97

    text_elements:
      - id: message
        content: "You make my heart smile!"
        x: 0.5
        y: 4.0
        width: 3.25
        font_size: 14
        alignment: center
        overflow_strategy: wrap
        max_lines: 10
        color:
          r: 0.35
          g: 0.15
          b: 0.2
        z_index: 100

  - id: inside_right
    position: inside_right
    x: 4.25
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180
    background_color:
      r: 1.0
      g: 0.96
      b: 0.97

  - id: back
    position: back
    x: 0.0
    y: 0.0
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 0.96
      b: 0.97
