# Birthday Balloons Card Template
# Half-fold card with a hand-drawn cluster of balloons + confetti.

id: "birthday-balloons"
name: "Birthday Balloons"
occasion: "birthday"
fold_type: "half_fold"
default_theme_id: "birthday-pastel"
description: "Fun birthday card with a colorful balloon cluster"

panels:
  # Front panel (bottom right when unfolded)
  - id: "front"
    position: "front"
    x: 4.25
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 0.99
      g: 0.96
      b: 0.99  # blush white
    shape_elements:
      # ---------- Confetti dots scattered in the background ----------
      - type: circle
        center_x: 0.45
        center_y: 4.95
        radius: 0.06
        fill_color: "#F4B400"
        opacity: 0.7
        z_index: 1
      - type: circle
        center_x: 3.85
        center_y: 4.85
        radius: 0.05
        fill_color: "#DB4437"
        opacity: 0.7
        z_index: 1
      - type: circle
        center_x: 0.65
        center_y: 1.85
        radius: 0.05
        fill_color: "#0F9D58"
        opacity: 0.7
        z_index: 1
      - type: circle
        center_x: 3.7
        center_y: 1.6
        radius: 0.07
        fill_color: "#4285F4"
        opacity: 0.6
        z_index: 1
      - type: circle
        center_x: 0.4
        center_y: 0.55
        radius: 0.06
        fill_color: "#F06292"
        opacity: 0.7
        z_index: 1
      - type: circle
        center_x: 3.55
        center_y: 0.4
        radius: 0.05
        fill_color: "#7E57C2"
        opacity: 0.7
        z_index: 1
      - type: rectangle
        x: 1.0
        y: 0.6
        width: 0.05
        height: 0.18
        fill_color: "#F4B400"
        rotation: 30
        opacity: 0.6
        z_index: 1
      - type: rectangle
        x: 3.1
        y: 0.7
        width: 0.05
        height: 0.18
        fill_color: "#0F9D58"
        rotation: 60
        opacity: 0.6
        z_index: 1

      # ---------- 5 balloon strings — converge at a single hand-hold point ----------
      # Knot point: (2.125, 1.45) — strings dangle from each balloon to here.
      - type: line
        start_x: 1.40
        start_y: 3.10
        end_x: 2.125
        end_y: 1.45
        stroke_color: "#9E9E9E"
        stroke_width: 0.6
        z_index: 2
      - type: line
        start_x: 2.125
        start_y: 3.40
        end_x: 2.125
        end_y: 1.45
        stroke_color: "#9E9E9E"
        stroke_width: 0.6
        z_index: 2
      - type: line
        start_x: 2.85
        start_y: 3.10
        end_x: 2.125
        end_y: 1.45
        stroke_color: "#9E9E9E"
        stroke_width: 0.6
        z_index: 2
      - type: line
        start_x: 1.70
        start_y: 2.55
        end_x: 2.125
        end_y: 1.45
        stroke_color: "#9E9E9E"
        stroke_width: 0.6
        z_index: 2
      - type: line
        start_x: 2.55
        start_y: 2.55
        end_x: 2.125
        end_y: 1.45
        stroke_color: "#9E9E9E"
        stroke_width: 0.6
        z_index: 2

      # ---------- 5 balloons (z=3 = above strings, below knots) ----------
      # Red balloon, top-left
      - type: circle
        center_x: 1.40
        center_y: 3.50
        radius: 0.40
        fill_color: "#DB4437"
        z_index: 3
      # Highlight on red balloon
      - type: circle
        center_x: 1.27
        center_y: 3.65
        radius: 0.10
        fill_color: "#FFFFFF"
        opacity: 0.45
        z_index: 4
      # Yellow balloon, top-center (highest)
      - type: circle
        center_x: 2.125
        center_y: 3.80
        radius: 0.40
        fill_color: "#F4B400"
        z_index: 3
      - type: circle
        center_x: 2.0
        center_y: 3.95
        radius: 0.10
        fill_color: "#FFFFFF"
        opacity: 0.45
        z_index: 4
      # Blue balloon, top-right
      - type: circle
        center_x: 2.85
        center_y: 3.50
        radius: 0.40
        fill_color: "#4285F4"
        z_index: 3
      - type: circle
        center_x: 2.72
        center_y: 3.65
        radius: 0.10
        fill_color: "#FFFFFF"
        opacity: 0.45
        z_index: 4
      # Pink balloon, lower-left
      - type: circle
        center_x: 1.70
        center_y: 2.95
        radius: 0.34
        fill_color: "#F06292"
        z_index: 3
      - type: circle
        center_x: 1.59
        center_y: 3.07
        radius: 0.085
        fill_color: "#FFFFFF"
        opacity: 0.45
        z_index: 4
      # Green balloon, lower-right
      - type: circle
        center_x: 2.55
        center_y: 2.95
        radius: 0.34
        fill_color: "#0F9D58"
        z_index: 3
      - type: circle
        center_x: 2.44
        center_y: 3.07
        radius: 0.085
        fill_color: "#FFFFFF"
        opacity: 0.45
        z_index: 4

      # ---------- Knots (small triangles at the bottom of each balloon) ----------
      - type: triangle
        x1: 1.36
        y1: 3.10
        x2: 1.44
        y2: 3.10
        x3: 1.40
        y3: 3.02
        fill_color: "#A52A2A"
        z_index: 4
      - type: triangle
        x1: 2.085
        y1: 3.40
        x2: 2.165
        y2: 3.40
        x3: 2.125
        y3: 3.32
        fill_color: "#B8860B"
        z_index: 4
      - type: triangle
        x1: 2.81
        y1: 3.10
        x2: 2.89
        y2: 3.10
        x3: 2.85
        y3: 3.02
        fill_color: "#1E3A8A"
        z_index: 4
      - type: triangle
        x1: 1.665
        y1: 2.61
        x2: 1.735
        y2: 2.61
        x3: 1.70
        y3: 2.54
        fill_color: "#AD1457"
        z_index: 4
      - type: triangle
        x1: 2.515
        y1: 2.61
        x2: 2.585
        y2: 2.61
        x3: 2.55
        y3: 2.54
        fill_color: "#1B5E20"
        z_index: 4

    text_elements:
      - id: "greeting"
        content: "Happy Birthday!"
        x: 2.125
        y: 4.85
        width: 3.5
        font_family: "Helvetica"
        font_size: 32
        font_style: "bold"
        alignment: "center"
        color:
          r: 0.4
          g: 0.15
          b: 0.55  # rich purple
      - id: "subtitle"
        content: "make a wish"
        x: 2.125
        y: 4.50
        width: 3.0
        font_family: "Times-Roman"
        font_size: 14
        font_style: "italic"
        alignment: "center"
        color:
          r: 0.5
          g: 0.3
          b: 0.6
    image_elements: []

  # Back panel
  - id: "back"
    position: "back"
    x: 0
    y: 0
    width: 4.25
    height: 5.5
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0

  # Inside left panel
  - id: "inside_left"
    position: "inside_left"
    x: 0
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180  # half-fold imposition
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0

  # Inside right panel
  - id: "inside_right"
    position: "inside_right"
    x: 4.25
    y: 5.5
    width: 4.25
    height: 5.5
    rotation: 180  # half-fold imposition
    background_color:
      r: 1.0
      g: 1.0
      b: 1.0
    text_elements:
      - id: "message"
        content: "Wishing you a day\nas wonderful as you are."
        x: 0.5
        y: 3.0
        width: 3.25
        font_family: "Times-Roman"
        font_size: 16
        font_style: "italic"
        alignment: "left"
        color:
          r: 0.3
          g: 0.3
          b: 0.3
