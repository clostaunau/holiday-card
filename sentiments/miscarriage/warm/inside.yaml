voice: warm
occasion: miscarriage
role: inside
sentiments:
  - "I am so sorry for what you've lost. There are no right words, only love — and you have ours."
  - "Take whatever time you need, in whatever shape it takes. I am here — quietly, patiently — for as long as it helps."
  - "This is a loss, and it is real, and we are so sorry. We are thinking of you both with the deepest care."
  - "Grieving alongside you. Whatever you need to feel, feel it. We are nearby."
