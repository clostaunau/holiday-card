voice: devotional
occasion: sympathy
role: inside
sentiments:
  - "May the Lord be near to the brokenhearted, and may His peace settle gently over your home."
  - "Praying for comfort, for presence, and for the slow return of light. You are held."
  - "Blessed are those who mourn — and may that blessing find you in tangible ways. With love and prayers."
  - "May grace meet you in the hardest hours and love carry you through the rest."
