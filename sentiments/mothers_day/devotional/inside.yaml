sentiments:
  - "Praise for the mother who gave us life, and for the One who gives life to mothers. Blessed Mother's Day."
  - "May the Lord keep you, watch over you, and make His face shine upon you today and always."
  - "For the years of love, the years of patience, the years of quiet prayer — thanks be to God, and to you."
  - "Wishing you the peace of Christ today, and the unceasing love of the family He has given you."
