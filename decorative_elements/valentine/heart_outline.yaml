name: heart_outline
description: "Heart outline using SVG path for clean curves"
default_width: 2.0
default_height: 1.8

color_roles:
  heart_stroke: "#DC143C"

shapes:
  - type: svg_path
    path_data: "M 1.0 0.3 C 1.0 0.0 0.5 0.0 0.2 0.3 C 0.0 0.5 0.0 0.9 0.5 1.4 L 1.0 1.8 L 1.5 1.4 C 2.0 0.9 2.0 0.5 1.8 0.3 C 1.5 0.0 1.0 0.0 1.0 0.3 Z"
    scale: 1.0
    fill_color: "#00000000"
    stroke_color: "{heart_stroke}"
    stroke_width: 2.5
    z_index: 5
