name: love_birds
description: "Two stylized birds facing each other with a heart between them"
default_width: 3.0
default_height: 2.0

color_roles:
  bird_left: "#DC143C"
  bird_right: "#B86E78"
  heart_accent: "#FFB6C1"
  beak: "#D4AF37"

shapes:
  # Left bird body
  - type: circle
    center_x: 0.7
    center_y: 0.9
    radius: 0.4
    fill_color: "{bird_left}"
    z_index: 2

  # Left bird tail
  - type: triangle
    x1: 0.3
    y1: 0.9
    x2: 0.0
    y2: 1.3
    x3: 0.0
    y3: 0.7
    fill_color: "{bird_left}"
    z_index: 1

  # Left bird beak
  - type: triangle
    x1: 1.1
    y1: 1.0
    x2: 1.3
    y2: 0.9
    x3: 1.1
    y3: 0.8
    fill_color: "{beak}"
    z_index: 3

  # Right bird body
  - type: circle
    center_x: 2.3
    center_y: 0.9
    radius: 0.4
    fill_color: "{bird_right}"
    z_index: 2

  # Right bird tail
  - type: triangle
    x1: 2.7
    y1: 0.9
    x2: 3.0
    y2: 1.3
    x3: 3.0
    y3: 0.7
    fill_color: "{bird_right}"
    z_index: 1

  # Right bird beak
  - type: triangle
    x1: 1.9
    y1: 1.0
    x2: 1.7
    y2: 0.9
    x3: 1.9
    y3: 0.8
    fill_color: "{beak}"
    z_index: 3

  # Small heart between birds
  - type: circle
    center_x: 1.35
    center_y: 1.55
    radius: 0.15
    fill_color: "{heart_accent}"
    z_index: 4

  - type: circle
    center_x: 1.65
    center_y: 1.55
    radius: 0.15
    fill_color: "{heart_accent}"
    z_index: 4

  - type: triangle
    x1: 1.2
    y1: 1.45
    x2: 1.8
    y2: 1.45
    x3: 1.5
    y3: 1.1
    fill_color: "{heart_accent}"
    z_index: 3
