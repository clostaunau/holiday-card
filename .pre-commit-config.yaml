repos:
  # ruff and mypy run from the uv lock so their versions never drift from CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        # Same paths as the CI lint gate.
        files: ^(src|tests|scripts)/
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
